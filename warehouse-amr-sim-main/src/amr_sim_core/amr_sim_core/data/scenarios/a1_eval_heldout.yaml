# A1 evaluation: held-out (higher) severities and combined faults, never seen during training.
name: a1_eval_heldout
world: warehouse_small
episode: {max_time: 60.0, goal_tolerance: 0.3, min_goal_distance: 5.0, max_goal_distance: 15.0}
pedestrians:
  density: [low, medium, high]
  distracted_fraction: 0.2
  speed: [0.8, 1.4]
  dwell_prob: 0.4
  dwell_time: [2.0, 8.0]
payload: [0.0, 60.0]
faults:
  p_nominal: 0.0
  types: [wheel_gain, cmd_latency, lidar_dropout, torque_loss, lidar_sector]
  max_simultaneous: 2           # combined faults
  severity: [0.6, 0.9]
  onset: [0.0, 0.0]
metrics: {near_miss_distance: 0.5}
