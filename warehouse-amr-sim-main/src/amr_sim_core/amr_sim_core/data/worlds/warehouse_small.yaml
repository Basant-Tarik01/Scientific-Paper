# Warehouse world definition: the single source of truth for
#   * the Gazebo Classic world  (warehouse_world/worlds/<name>.world)
#   * the Nav2 occupancy map    (warehouse_world/maps/<name>.pgm/.yaml)
#   * the fast 2D simulator     (amr_sim_core.sim2d / gym env)
# Regenerate the Gazebo world and map after editing:
#   python3 -m amr_sim_core.tools.generate_assets --world warehouse_small --out src/warehouse_world
#
# Frame: x to the right, y up, origin at the bottom-left inner corner of the walls. Units: metres.
#
#  y=20 +----------------------------------------------------------+
#       |  packing stations (top area)              |  dock/pallets |
#  y=15 |      ======= =======        ======= =======               |
#       |      ======= =======   P    ======= =======               |   ===  rack rows (1.2 m deep)
#       |      ======= =======        ======= =======               |   gaps = narrow cross-aisles (2 m)
#  y=3  |      ======= =======        ======= =======               |   P = building pillar
#       |  charging            main transport aisle                 |
#  y=0  +----------------------------------------------------------+
#      x=0    x=4         x=13  x=17        x=26                 x=30

name: warehouse_small
description: >
  30 x 20 m single-floor warehouse. Two rack blocks (4 double-deep rack rows each) separated by a
  4 m central cross-aisle, 2.4 m picking aisles, a narrow 2 m cross-aisle through each block
  (blind intersections), a main transport aisle at the bottom, packing stations at the top,
  a pallet dock area at the top right and a charging area at the bottom left.

size: [30.0, 20.0]
walls:
  thickness: 0.2
  height: 3.0

rack_blocks:
  - name: A
    origin: [4.0, 3.0]        # bottom-left corner of the first rack row
    rows: 4
    row_length: 9.0
    row_depth: 1.2
    aisle_width: 2.4
    height: 2.4
    levels: 4
    gaps:                       # narrow cross-aisle cut through every row of the block
      - {at: 4.5, width: 2.0}   # 'at' = centre of the gap, measured from the row start
  - name: B
    origin: [17.0, 3.0]
    rows: 4
    row_length: 9.0
    row_depth: 1.2
    aisle_width: 2.4
    height: 2.4
    levels: 4
    gaps:
      - {at: 4.5, width: 2.0}

obstacles:
  # building pillars inside the central cross-aisle (create occlusions)
  - {name: pillar_1, kind: pillar, center: [15.0, 9.0], size: [0.4, 0.4], height: 3.0}
  - {name: pillar_2, kind: pillar, center: [15.0, 17.5], size: [0.4, 0.4], height: 3.0}
  # packing stations (closed-base benches)
  - {name: packing_1, kind: station, center: [6.5, 18.6], size: [2.0, 0.8], height: 0.9}
  - {name: packing_2, kind: station, center: [10.5, 18.6], size: [2.0, 0.8], height: 0.9}
  - {name: packing_3, kind: station, center: [19.5, 18.6], size: [2.0, 0.8], height: 0.9}
  - {name: packing_4, kind: station, center: [23.5, 18.6], size: [2.0, 0.8], height: 0.9}
  # pallets waiting at the dock
  - {name: pallet_1, kind: pallet, center: [28.9, 18.9], size: [1.2, 1.0], height: 1.2}
  - {name: pallet_2, kind: pallet, center: [28.9, 17.4], size: [1.2, 1.0], height: 0.8}
  - {name: pallet_3, kind: pallet, center: [27.2, 18.9], size: [1.2, 1.0], height: 1.4}
  # charging dock against the left wall
  - {name: charger, kind: charger, center: [0.2, 1.5], size: [0.3, 0.6], height: 0.5}

zones:                          # [xmin, ymin, xmax, ymax]; used for sampling and pedestrian behaviour
  charging: [0.5, 0.5, 3.0, 2.8]
  transport_aisle: [0.5, 0.3, 29.5, 2.8]
  packing: [4.0, 15.3, 25.0, 18.0]
  dock: [25.5, 15.3, 29.7, 19.7]
  picking_A: [4.0, 3.0, 13.0, 15.0]
  picking_B: [17.0, 3.0, 26.0, 15.0]

pedestrians:
  max: 16                       # number of pedestrian models pre-spawned in the Gazebo world
  densities: {none: 0, low: 4, medium: 8, high: 14}
  # probability that a new route ends in one of these zones (rest: any graph node)
  zone_goal_weights: {picking_A: 0.3, picking_B: 0.3, packing: 0.2, dock: 0.1}

graph:                          # waypoint graph used for routing pedestrians and sampling start/goal
  spacing: 1.0
  clearance: 0.6                # minimum distance from obstacles for a node / edge

robot_spawn: {x: 1.6, y: 1.5, yaw: 0.0}
